services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Amrutam Telemedicine Backend
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/amrutam_telemedicine
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=amrutam-production-super-secret-key-32-bytes-minimum!
      - PAYMENT_WEBHOOK_SECRET=amrutam-prod-webhook-secret-key-32-chars
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-outbox-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/amrutam_telemedicine
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.outbox_worker

  db:
    image: postgres:16-alpine
    container_name: amrutam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amrutam_telemedicine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amrutam_telemedicine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amrutam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: amrutam-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
