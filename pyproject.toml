[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amrutam-telemedicine-backend"
version = "1.0.0"
description = "Production-grade telemedicine backend for Amrutam with concurrency-safe booking, RBAC, and observability."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shubham Gupta" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.9",
    "pyjwt[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.2",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",
    "qrcode>=7.4.2",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.3"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
