name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amrutam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Alembic Migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amrutam_test
      run: |
        alembic upgrade head

    - name: Run Pytest Suite
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amrutam_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest -v --durations=10

    - name: Validate OpenAPI Schema Generation
      run: |
        python -c "from app.main import app; import json; open('openapi.json', 'w').write(json.dumps(app.openapi()))"
        test -s openapi.json
